<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>临汀项目资料室 · 案例资料</title>
<style>
:root{font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:#162d35;background:#edf3f1}*{box-sizing:border-box}body{margin:0}.top{background:#173639;color:#f1faf5;padding:16px max(20px,calc((100% - 980px)/2));display:flex;align-items:center;gap:16px}.top a{white-space:nowrap;color:inherit;text-decoration:none;font-weight:700}.top small{white-space:nowrap;font-size:.78rem;color:#c4dcd0;border:1px solid #63847c;padding:2px 8px;border-radius:3px}main{width:min(980px,calc(100% - 40px));margin:42px auto}h1{font-size:2.15rem;margin:8px 0;line-height:1.25;letter-spacing:-.025em}h2{font-size:1.2rem;margin:28px 0 12px}.hint,.caption{color:#486563}.caption{font-size:.86rem;letter-spacing:.04em}form{display:flex;gap:8px;margin:24px 0}input{width:min(100%,500px);background:#fff;border:1px solid #8ca8a0;border-radius:4px;padding:10px 13px;font:inherit;min-width:0}button{font:inherit;background:#206052;color:#fff;border:0;border-radius:4px;padding:0 21px;cursor:pointer;white-space:nowrap}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.record{display:block;background:white;border:1px solid #d0ded8;padding:15px 18px;border-radius:5px;color:#194d44;text-decoration:none}.record:hover,.record:focus-visible{border-color:#206052}.record span{display:block;color:#496764;font-size:.85rem;margin-top:3px}.detail{background:#fff;padding:23px 28px;border:1px solid #c9d9d2;border-radius:5px;margin-top:24px}.detail dl{margin:0}.detail dl div{display:grid;grid-template-columns:minmax(100px, 175px) 1fr;gap:10px;border-bottom:1px solid #e4ede8;padding:10px 0}.detail dl div:last-child{border-bottom:0}.detail dt{color:#456560;font-weight:650}.detail dd{margin:0}.back{color:#206052}@media(max-width:620px){.list{grid-template-columns:1fr}.detail{padding:14px}.detail dl div{grid-template-columns:1fr;gap:0}h1{font-size:1.7rem}}
</style>
</head>
<body><header class="top"><a href="./">临汀项目资料室</a><small>案例资料</small></header><main></main><script src="mock.js"></script></body>
</html>
