<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">让法律 Agent 在工作流中接受检验</title><desc id="desc">从一次交办，到一份可以审阅的工作成果。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#193e34}.muted{fill:#657b6e;font-size:17px}.label{font-size:14px;letter-spacing:2px}.heading{font-size:32px;font-weight:600}.body{font-size:19px}.white{fill:#fff}</style><rect width="1200" height="460" rx="16" fill="#f1f6ef"/><rect x="32" y="32" width="1136" height="396" rx="12" fill="#fff" stroke="#d8e3d7"/><text x="62" y="75" class="label">LEGALGYM / DESIGN PREVIEW</text><text x="62" y="125" class="heading">让法律 Agent 在工作流中接受检验</text><text x="62" y="161" class="muted">从一次交办，到一份可以审阅的工作成果。</text><rect x="62" y="195" width="345" height="175" rx="8" fill="#f4f7f1" stroke="#dce5d8"/><text x="82" y="231" class="body" font-weight="600">任务与材料</text><text x="82" y="269" class="muted">客户交办 · 邮件</text><text x="82" y="302" class="muted">合同与业务背景</text><text x="82" y="335" class="muted">允许使用的查询工具</text><rect x="427" y="195" width="345" height="175" rx="8" fill="#f4f7f1" stroke="#dce5d8"/><text x="447" y="231" class="body" font-weight="600">操作与变化</text><text x="447" y="269" class="muted">读取与核对材料</text><text x="447" y="302" class="muted">保存文档新版本</text><text x="447" y="335" class="muted">提出客户确认事项</text><rect x="792" y="195" width="345" height="175" rx="8" fill="#f4f7f1" stroke="#dce5d8"/><text x="812" y="231" class="body" font-weight="600">成果与验证</text><text x="812" y="269" class="muted">修订稿与回复</text><text x="812" y="302" class="muted">文件及内容检查</text><text x="812" y="335" class="muted">专家复核与证据</text><text x="62" y="405" class="label">图片占位 · 后续替换为真实工作台截图，不表示已实现以上完整能力</text></svg>