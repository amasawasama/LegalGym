<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">每个结果，都能回到证据</title><desc id="desc">未来将同时展示业务进展与 Agent 的可观察操作。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#193e34}.muted{fill:#657b6e;font-size:17px}.label{font-size:14px;letter-spacing:2px}.heading{font-size:32px;font-weight:600}.body{font-size:19px}.white{fill:#fff}</style><rect width="1200" height="460" rx="16" fill="#f1f6ef"/><rect x="32" y="32" width="1136" height="396" rx="12" fill="#fff" stroke="#d8e3d7"/><text x="62" y="75" class="label">LEGALGYM / DESIGN PREVIEW</text><text x="62" y="125" class="heading">每个结果，都能回到证据</text><text x="62" y="161" class="muted">未来将同时展示业务进展与 Agent 的可观察操作。</text><rect x="62" y="200" width="345" height="160" rx="8" fill="#f7f9f5" stroke="#a9bdac" stroke-dasharray="7 5"/><text x="82" y="243" class="body">事件时间线</text><text x="82" y="280" class="muted">读取、查询、保存、提交</text><text x="82" y="328" class="label">等待真实运行证据</text><rect x="427" y="200" width="345" height="160" rx="8" fill="#f7f9f5" stroke="#a9bdac" stroke-dasharray="7 5"/><text x="447" y="243" class="body">工具与文件</text><text x="447" y="280" class="muted">输入、返回、错误、版本差异</text><text x="447" y="328" class="label">等待真实运行证据</text><rect x="792" y="200" width="345" height="160" rx="8" fill="#f7f9f5" stroke="#a9bdac" stroke-dasharray="7 5"/><text x="812" y="243" class="body">验证证据</text><text x="812" y="280" class="muted">成果位置、标准版本、专家意见</text><text x="812" y="328" class="label">等待真实运行证据</text><text x="62" y="405" class="label">回放图片占位 · 当前网页仅为教学回放，没有真实模型成绩</text></svg>